name: Deploy
# Publishes the standalone studio (dist/: landing page + editor, static files only) on every push to main, after the
# same checks as CI. Needs two repository secrets, set by the owner: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on
# this account only) and CLOUDFLARE_ACCOUNT_ID. Without them the job is skipped, never failed.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Secrets present?
        run: echo "deploy=$HAS_TOKEN"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        run: npm run typecheck && npm test && npm run build
      - name: Publish
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check the live site
        if: env.HAS_TOKEN == 'true' && vars.STUDIO_URL != ''
        run: |
          url="${{ vars.STUDIO_URL }}"
          for p in / /editor/ /studio/models/u2netp.onnx; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$p"); echo "$p $code"; [ "$code" = "200" ]
          done
          curl -sI "$url/" | grep -i '^content-security-policy:'
