name: Deploy
# Publishes the standalone studio (dist/: landing page + editor, static files only) on every push to main.
# Two jobs, so no dependency ever runs next to the deploy token:
#   build  — npm ci, checks and build, WITHOUT any secret; hands dist/ over as an artifact.
#   deploy — environment "production" (main only; its secrets live there): downloads dist/ and runs wrangler only.
# Without the environment's secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) the deploy steps are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: |
            dist
            wrangler.jsonc
          include-hidden-files: true
          retention-days: 3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      STUDIO_URL: ${{ vars.STUDIO_URL }}
    steps:
      - name: Secrets present?
        run: echo "deploy=$HAS_TOKEN"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.HAS_TOKEN == 'true'
        with:
          name: site
      - name: Publish
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy
      - name: Check the live site
        if: env.HAS_TOKEN == 'true' && env.STUDIO_URL != ''
        run: |
          for p in / /editor/ /studio/models/u2netp.onnx; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$STUDIO_URL$p"); echo "$p $code"; [ "$code" = "200" ]
          done
          curl -sI "$STUDIO_URL/" | grep -i '^content-security-policy:'
